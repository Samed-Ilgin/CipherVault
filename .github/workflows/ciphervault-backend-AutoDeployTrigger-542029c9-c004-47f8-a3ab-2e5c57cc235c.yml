name: Trigger auto deployment for ciphervault-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ciphervault-backend-AutoDeployTrigger-542029c9-c004-47f8-a3ab-2e5c57cc235c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CIPHERVAULTBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CIPHERVAULTBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CIPHERVAULTBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}Backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ciphervaultacr.azurecr.io
          registryUsername: ${{ secrets.CIPHERVAULTBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CIPHERVAULTBACKEND_REGISTRY_PASSWORD }}
          containerAppName: ciphervault-backend
          resourceGroup: ciphervault-rg
          imageToBuild: ciphervaultacr.azurecr.io/ciphervault-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


